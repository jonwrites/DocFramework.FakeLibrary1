name: Publish documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOC_VERSION: v1.0

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build project
        run: dotnet build src/FakeLibrary/FakeLibrary.csproj --configuration Release

      - name: Setup DocFX
        run: dotnet tool update -g docfx

      - name: Generate API metadata
        working-directory: docs
        run: docfx metadata

      - name: Build documentation site
        working-directory: docs
        run: docfx build

      - name: Publish documentation to Azure
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --destination '$web' \
              --destination-path "${{ env.DOC_VERSION }}" \
              --source 'docs/_site'